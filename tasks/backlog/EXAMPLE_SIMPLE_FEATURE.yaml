id: EXAMPLE_SIMPLE_FEATURE
title: 示例：为新玩家设计一个首次进入游戏的欢迎提示
type: feature
owner: master
parent: null
objective: >-
  演练 Master Agent 从自然语言目标开始，调用必要的 Product、UI 和 QA 角色，
  形成一个简单、可验收、无需预设客户端技术栈的功能规格。
inputs:
  - AGENTS.md
  - STUDIO.md
  - project/GAME_DESIGN.md
  - project/PRD.md
  - project/UI_SPEC.md
  - project/DECISIONS.md
deliverables:
  - 产品规则说明
  - UI 交互规格
  - QA 验收用例
  - Master 汇总报告
acceptance:
  - 明确欢迎提示在什么条件下出现
  - 明确用户如何关闭以及是否再次出现
  - UI 至少定义正常状态和关闭动作
  - QA 至少覆盖首次进入、再次进入和重复操作
  - 不引入未授权的付费、经济或技术栈假设
dependencies: []
status: BACKLOG
approval: AUTO
notes:
  - 这是工作室初始化后的演练任务，不代表项目已正式决定要实现该功能。
